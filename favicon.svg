<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1237a8"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff59a"/>
      <stop offset="0.6" stop-color="#ffd92e"/>
      <stop offset="1" stop-color="#f0a800"/>
    </radialGradient>
  </defs>

  <!-- Rounded app background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)" stroke="#0a1f66" stroke-width="10"/>
  <rect x="34" y="30" width="444" height="200" rx="95" fill="#ffffff" opacity="0.12"/>

  <!-- Stars -->
  <g fill="#ffe14d" stroke="#0a1f66" stroke-width="4" stroke-linejoin="round">
    <path d="M96 118l10 22 24 3-18 16 5 24-21-12-21 12 5-24-18-16 24-3z"/>
    <path d="M420 96l7 15 17 2-12 11 3 17-15-8-15 8 3-17-12-11 17-2z"/>
  </g>

  <!-- Smiley face -->
  <circle cx="256" cy="214" r="112" fill="url(#face)" stroke="#0a1f66" stroke-width="10"/>
  <ellipse cx="212" cy="196" rx="15" ry="24" fill="#1b1b1b"/>
  <ellipse cx="300" cy="196" rx="15" ry="24" fill="#1b1b1b"/>
  <circle cx="217" cy="186" r="5" fill="#fff"/>
  <circle cx="305" cy="186" r="5" fill="#fff"/>
  <path d="M196 250q60 62 120 0" fill="#7a1f12" stroke="#0a1f66" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M214 262q42 26 84 0q-42 10 -84 0z" fill="#ff6b6b"/>

  <!-- Cap -->
  <path d="M150 168q8-96 106-98q98 2 106 98q-106-28-212 0z" fill="#1d4fd8" stroke="#0a1f66" stroke-width="10" stroke-linejoin="round"/>
  <path d="M356 160q50 4 62 26q-34-10 -70 -8z" fill="#163fae" stroke="#0a1f66" stroke-width="8" stroke-linejoin="round"/>
  <!-- Planet logo on cap -->
  <circle cx="256" cy="122" r="17" fill="#7fd0ff" stroke="#0a1f66" stroke-width="5"/>
  <ellipse cx="256" cy="122" rx="30" ry="8" fill="none" stroke="#fff" stroke-width="5" transform="rotate(-20 256 122)"/>

  <!-- Game controller -->
  <g transform="translate(0 6)">
    <path d="M118 346q-12 0-22 16l-28 70q-6 24 14 30q20 6 34-14l22-32h196l22 32q14 20 34 14q20-6 14-30l-28-70q-10-16-22-16z"
