    <path d="M130 360h252q14 0 20 12" fill="none" stroke="#fff" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
    <!-- D-pad -->
    <path d="M150 380h20v18h18v20h-18v18h-20v-18h-18v-20h18z" fill="#fff" stroke="#0a1f66" stroke-width="5" stroke-linejoin="round"/>
    <!-- Buttons -->
    <circle cx="350" cy="386" r="13" fill="#ffe14d" stroke="#0a1f66" stroke-width="5"/>
    <circle cx="384" cy="410" r="13" fill="#4dff9e" stroke="#0a1f66" stroke-width="5"/>
    <circle cx="316" cy="410" r="13" fill="#7fd0ff" stroke="#0a1f66" stroke-width="5"/>
  </g>
</svg>
